<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#5B8A1A">
<title>Acta de entrega de celular — Falabella Home Delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
:root{--green:#74BC1C;--green-d:#3B6E0F;--green-l:#EEF6E3;--dark:#303848;--gray-1:#F4F5F7;--gray-3:#D9DCE1;--gray-5:#8A919C;--gray-7:#4B5160;--danger:#DC2626;--danger-l:#FEE2E2;--warn:#B45309;--warn-l:#FEF3C7;--white:#fff;--r:12px;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Poppins',Arial,sans-serif;background:var(--gray-1);color:var(--dark);font-size:14px;}
header{background:var(--green-d);color:#fff;padding:16px 18px 14px;}
header .eb{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.85;}
header h1{margin:4px 0 0;font-size:19px;line-height:1.25;}
main{max-width:640px;margin:0 auto;padding:14px 14px 40px;}
.card{background:var(--white);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.card h2{margin:0 0 10px;font-size:15px;color:var(--green-d);display:flex;align-items:center;gap:8px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
td{padding:6px 4px;border-bottom:1px solid var(--gray-1);vertical-align:top;}
td.k{color:var(--gray-5);width:42%;font-weight:500;}
td.v{font-weight:600;word-break:break-word;}
.cl p{margin:0 0 9px;line-height:1.5;font-size:13.5px;color:var(--gray-7);}
.cl b{color:var(--green-d);}
label.f{display:block;font-size:13px;font-weight:600;margin:0 0 6px;}
input[type=text]{width:100%;font:inherit;font-size:16px;padding:12px;border:1.5px solid var(--gray-3);border-radius:10px;}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;font-weight:600;line-height:1.45;margin:14px 0 4px;cursor:pointer;}
.chk input{width:22px;height:22px;flex:0 0 22px;margin:1px 0 0;accent-color:var(--green);}
.pad{position:relative;border:2px dashed var(--gray-3);border-radius:10px;background:#fff;touch-action:none;}
#firma{display:block;width:100%;height:190px;}
.pad .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--gray-5);font-size:13px;pointer-events:none;}
.btns{display:flex;gap:10px;margin-top:12px;}
button{font:inherit;border:none;border-radius:10px;padding:14px 12px;font-size:15px;font-weight:700;cursor:pointer;}
#b-limpiar{background:var(--white);border:1.5px solid var(--gray-3);color:var(--gray-7);flex:0 0 auto;}
#b-firmar{background:var(--green);color:#fff;flex:1;}
#b-firmar:disabled{background:var(--gray-3);color:var(--gray-5);cursor:not-allowed;}
.msg{border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.5;margin-bottom:12px;}
.msg.err{background:var(--danger-l);color:#7F1D1D;border-left:4px solid var(--danger);}
.msg.ok{background:var(--green-l);color:var(--green-d);border-left:4px solid var(--green);}
.msg.info{background:var(--warn-l);color:#78350F;border-left:4px solid var(--warn);}
.big{text-align:center;padding:26px 16px;}
.big i{font-size:54px;color:var(--green);}
.big h2{justify-content:center;font-size:18px;}
.hide{display:none;}
.cargando{text-align:center;color:var(--gray-5);padding:40px 0;}
</style>
</head>
<body>
<header><div class="eb">Falabella Home Delivery</div><h1>Acta de entrega de celular corporativo</h1></header>
<main>
  <div id="cargando" class="cargando"><i class="ti ti-loader-2"></i> Cargando el acta...</div>
  <div id="error" class="msg err hide"></div>
  <div id="contenido" class="hide">
    <div id="ya" class="card big hide"><i class="ti ti-circle-check"></i><h2>Acta firmada</h2><div id="ya-txt" style="color:var(--gray-7)"></div></div>
    <div class="card"><h2><i class="ti ti-file-certificate"></i><span id="t-num">Acta</span></h2><table id="t-datos"></table></div>
    <div class="card"><h2><i class="ti ti-device-mobile"></i>Equipo que recibes</h2><table id="t-equipo"></table></div>
    <div class="card cl"><h2><i class="ti ti-list-check"></i>Tus compromisos</h2><div id="t-texto"></div></div>
    <div id="zona-firma" class="card">
      <h2><i class="ti ti-signature"></i>Confirma y firma</h2>
      <label class="f" for="cedula">Tu número de cédula <span id="ced-ayuda" style="font-weight:400;color:var(--gray-5)"></span></label>
      <input type="text" id="cedula" inputmode="numeric" autocomplete="off" placeholder="Sin puntos ni espacios">
      <label class="chk"><input type="checkbox" id="acepto"><span>Leí el acta, recibí el equipo y los accesorios descritos, y <b>acepto los compromisos</b>.</span></label>
      <label class="f" style="margin-top:12px">Firma con tu dedo en el recuadro</label>
      <div class="pad"><canvas id="firma"></canvas><div class="ph" id="ph">Firma aquí</div></div>
      <div id="err-firma" class="msg err hide" style="margin:12px 0 0"></div>
      <div class="btns"><button type="button" id="b-limpiar"><i class="ti ti-eraser"></i> Borrar</button><button type="button" id="b-firmar" disabled>Firmar acta</button></div>
    </div>
  </div>
</main>
<script>
// ═══ CONFIGURACIÓN: pega aquí el mismo enlace del código de Google que usan el panel y el preoperacional ═══
var API_URL = 'https://script.google.com/macros/s/AKfycbwjiumARkgmcSAHCdOEbNJhSPFC1jWj32zhl-wAmkniAcnYlTGwV9pU4UmiN1JQ2Kw/exec';
// Ejemplo: var API_URL = 'https://script.google.com/macros/s/ABC123.../exec';

var TOKEN = (function(){ var m=/[?&]t=([A-Za-z0-9]{16,64})/.exec(window.location.search); return m?m[1]:''; })();
var GPS = null, trazo = false, ACTA = null;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function mostrar(id, si){ $(id).className = $(id).className.replace(/\s*hide/g,'') + (si?'':' hide'); }
function error(txt){ mostrar('cargando', false); $('error').textContent = txt; mostrar('error', true); }
function filas(pares){
  return pares.filter(function(p){ return String(p[1]||'').trim(); })
    .map(function(p){ return '<tr><td class="k">'+esc(p[0])+'</td><td class="v">'+esc(p[1])+'</td></tr>'; }).join('');
}
function pintar(r){
  var a = r.acta || {}, e = a.equipo || {};
  ACTA = a;
  $('t-num').textContent = 'Acta ' + (a.num||'');
  $('t-datos').innerHTML = filas([['Empresa', (a.empresa||'') + (a.nit?' · NIT '+a.nit:'')], ['Conductor', a.conductor], ['Fecha de entrega', a.fechaEntrega],
    ['Bodega', a.bodega], ['Vehículo', a.placa], ['Entregado por', a.entregadoPor]]);
  $('t-equipo').innerHTML = filas([['Equipo', ((e.marca||'')+' '+(e.modelo||'')).trim()], ['IMEI', e.imei], ['IMEI 2', e.imei2], ['Serial', e.serial],
    ['Línea', e.linea], ['Operador', e.operador], ['Color', e.color], ['Estado', a.estadoEquipo],
    ['Accesorios', (a.accesorios||[]).length ? a.accesorios.join(', ') : 'Ninguno'], ['Observaciones', a.obs]]);
  $('t-texto').innerHTML = (a.texto||[]).map(function(t,i){ return '<p><b>'+(i+1)+'.</b> '+esc(t)+'</p>'; }).join('');
  $('ced-ayuda').textContent = a.cedulaFin ? '(termina en ' + a.cedulaFin + ')' : '';
  mostrar('cargando', false); mostrar('contenido', true);
  if (r.firmada) { yaFirmada(r.fechaFirma); }
  else { prepararFirma(); pedirGps(); }
}
function yaFirmada(fecha){
  $('ya-txt').innerHTML = 'Esta acta ya quedó firmada' + (fecha ? ' el <b>' + esc(fecha) + '</b>' : '') + '. No tienes que hacer nada más.<br>¡Gracias!';
  mostrar('ya', true); mostrar('zona-firma', false);
  window.scrollTo(0, 0);
}
function pedirGps(){
  try{
    if (navigator.geolocation) navigator.geolocation.getCurrentPosition(function(p){ GPS = {lat:p.coords.latitude, lng:p.coords.longitude}; }, function(){}, {timeout:15000, maximumAge:60000});
  }catch(e){ GPS = null; }
}
// ── Firma con el dedo ──
var cv, cx;
function prepararFirma(){
  cv = $('firma'); cx = cv.getContext('2d');
  function ajustar(){
    var r = cv.getBoundingClientRect(), k = window.devicePixelRatio || 1;
    var img = trazo ? cv.toDataURL() : null;
    cv.width = Math.round(r.width * k); cv.height = Math.round(r.height * k);
    cx.setTransform(k, 0, 0, k, 0, 0);
    cx.lineWidth = 2.4; cx.lineCap = 'round'; cx.lineJoin = 'round'; cx.strokeStyle = '#111';
    if (img) { var im = new Image(); im.onload = function(){ cx.drawImage(im, 0, 0, r.width, r.height); }; im.src = img; }
  }
  ajustar();
  window.addEventListener('resize', ajustar);
  var dib = false, ult = null;
  function pos(ev){
    var r = cv.getBoundingClientRect(), t = ev.touches && ev.touches[0] ? ev.touches[0] : ev;
    return {x: t.clientX - r.left, y: t.clientY - r.top};
  }
  function ini(ev){ ev.preventDefault(); dib = true; ult = pos(ev); cx.beginPath(); cx.arc(ult.x, ult.y, 1.1, 0, 6.3); cx.fill(); marcar(); }
  function mov(ev){ if (!dib) return; ev.preventDefault(); var p = pos(ev); cx.beginPath(); cx.moveTo(ult.x, ult.y); cx.lineTo(p.x, p.y); cx.stroke(); ult = p; }
  function fin(){ dib = false; }
  function marcar(){ trazo = true; $('ph').style.display = 'none'; validar(); }
  cv.addEventListener('mousedown', ini); cv.addEventListener('mousemove', mov); window.addEventListener('mouseup', fin);
  cv.addEventListener('touchstart', ini, {passive:false}); cv.addEventListener('touchmove', mov, {passive:false}); cv.addEventListener('touchend', fin);
  $('b-limpiar').addEventListener('click', function(){ cx.clearRect(0, 0, cv.width, cv.height); trazo = false; $('ph').style.display = ''; validar(); });
  $('cedula').addEventListener('input', validar);
  $('acepto').addEventListener('change', validar);
  $('b-firmar').addEventListener('click', firmar);
}
function cedulaVal(){ return String($('cedula').value || '').replace(/\D/g, ''); }
function validar(){
  $('b-firmar').disabled = !(trazo && $('acepto').checked && cedulaVal().length >= 5);
  mostrar('err-firma', false);
}
function errFirma(t){ $('err-firma').textContent = t; mostrar('err-firma', true); }
function firmar(){
  if ($('b-firmar').disabled) return;
  if (ACTA && ACTA.cedulaFin && cedulaVal().slice(-ACTA.cedulaFin.length) !== ACTA.cedulaFin) {
    errFirma('La cédula no coincide con la del conductor de esta acta (debe terminar en ' + ACTA.cedulaFin + ').'); return;
  }
  var b = $('b-firmar'); b.disabled = true; b.textContent = 'Enviando firma...';
  var cuerpo = {action:'actaCelularFirmar', token:TOKEN, cedula:cedulaVal(), acepta:true, firma:cv.toDataURL('image/png'),
    gps:GPS, dispositivo:String(navigator.userAgent || '').slice(0, 150)};
  enviar(cuerpo, 0);
}
function enviar(cuerpo, intento){
  fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(cuerpo)})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (j && j.ok) { yaFirmada(j.fechaFirma); return; }
      errFirma((j && j.error) || 'No se pudo guardar la firma. Intenta de nuevo.');
      var b = $('b-firmar'); b.textContent = 'Firmar acta'; validar();
    })
    .catch(function(){
      if (intento < 2) { setTimeout(function(){ enviar(cuerpo, intento + 1); }, 2500); return; }
      errFirma('Sin conexión. Revisa tu señal o datos móviles y toca «Firmar acta» de nuevo.');
      var b = $('b-firmar'); b.textContent = 'Firmar acta'; validar();
    });
}
(function iniciar(){
  if (!API_URL) { error('Esta página aún no está configurada (falta el enlace del sistema). Avísale a tu coordinador.'); return; }
  if (!TOKEN) { error('El enlace está incompleto. Pide a tu coordinador que te envíe el acta de nuevo por WhatsApp.'); return; }
  fetch(API_URL + (API_URL.indexOf('?') > -1 ? '&' : '?') + 'action=actaCelular&t=' + encodeURIComponent(TOKEN) + '&_ts=' + Date.now(), {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(j){ if (j && j.ok) pintar(j); else error((j && j.error) || 'No se pudo cargar el acta.'); })
    .catch(function(){ error('No se pudo cargar el acta. Revisa tu conexión a internet y vuelve a abrir el enlace.'); });
})();
</script>
</body>
</html>
